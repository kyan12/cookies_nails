{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="max-w-2xl mx-auto px-4 py-16 sm:px-6 lg:px-8 text-center">
        <h1 class="font-playfair text-4xl md:text-5xl font-bold text-dark mb-6">Something Went Wrong</h1>
        <p class="text-lg text-gray-600 mb-8">
            We're experiencing some technical difficulties. Please try again later or use one of the links below.
        </p>
        <div class="space-y-4">
            <a href="/" class="inline-block bg-accent text-white px-8 py-3 rounded-full hover:bg-primary transition-colors">Return Home</a>
            <p class="text-gray-600">or</p>
            <a href="/book" class="inline-block border-2 border-accent text-accent px-8 py-3 rounded-full hover:bg-accent hover:text-white transition-colors">Book an Appointment</a>
        </div>
    </div>
</div>
{% endblock %}
